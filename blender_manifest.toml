schema_version = "1.0.0"

id = "ominaeshi"
version = "0.1.1"
name = "女郎花"
tagline = "マーベラスデザイナーの服とボディを検査・修理して ZOZO にセット"
maintainer = "Yoshihiko Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

[permissions]
files = "ZOZO MCP 用の一時設定を書き込む"
network = "ローカルホストの ZOZO Contact Solver MCP に接続する"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "i18n.py",
    "zozo_handoff.py",
    "zozo_stitches.py",
    "zozo_mcp_client.py",
    "shell_isect_bridge.py",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "LICENSE",
    "bin/vcomp140.dll",
    "bin/shell_isect.dll",
    "bin/SHELL_ISECT_README.txt",
]
