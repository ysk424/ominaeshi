schema_version = "1.0.0"

id = "ominaeshi"
version = "0.2.2"
name = "女郎花"
tagline = "MD と服を往復し検査・修理して ZOZO にセット"
maintainer = "Yoshihiko Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

[permissions]
files = "MD ブリッジ一時ファイルと ZOZO MCP 設定を書き込む"
network = "ローカルホストで MD ブリッジと ZOZO Contact Solver MCP に接続する"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "i18n.py",
    "md_bridge.py",
    "zozo_handoff.py",
    "zozo_stitches.py",
    "zozo_mcp_client.py",
    "shell_isect_bridge.py",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "LICENSE",
    "md_addon/_bridge.py",
    "md_addon/_import_avatar.py",
    "md_addon/1_get_BL_avater.py",
    "md_addon/2_send_clothes_BL.py",
    "bin/vcomp140.dll",
    "bin/shell_isect.dll",
    "bin/SHELL_ISECT_README.txt",
]
