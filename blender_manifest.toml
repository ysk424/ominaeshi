schema_version = "1.0.0"

id = "ominaeshi"
version = "0.3.2"
name = "女郎花"
tagline = "MD の服 OBJ と Pattern JSON を HOU に変換"
maintainer = "Yoshihiko Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

[permissions]
files = "MD ブリッジの一時ファイルを読み書きする"
network = "ローカルホストで Marvelous Designer ブリッジに接続する"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "i18n.py",
    "md_bridge.py",
    "hou_export.py",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "LICENSE",
    "md_addon/_bridge.py",
    "md_addon/_import_avatar.py",
    "md_addon/1_get_BL_avater.py",
    "md_addon/2_send_clothes_BL.py",
]
